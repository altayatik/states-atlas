<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Altay & Aidi's Travel Atlas — states, cities, national parks, and milestones." />
    <meta name="theme-color" content="#eef3f8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Travel Atlas</title>
  </head>
  <body>
    <div class="aurora" aria-hidden="true">
      <span class="scene-sun"></span>
      <span class="aurora__glow aurora__glow--peach"></span>
      <span class="aurora__glow aurora__glow--gold"></span>
      <span class="cloud cloud--a"></span>
      <span class="cloud cloud--b"></span>
      <span class="cloud cloud--c"></span>
      <svg class="scene-sky" viewBox="0 0 1440 460" preserveAspectRatio="xMidYMin slice" xmlns="http://www.w3.org/2000/svg">
        <path id="fly-a" class="airline" d="M-40 140 C 380 50 900 220 1500 80" />
        <path id="fly-b" class="airline airline--dim" d="M-40 300 C 420 220 880 340 1500 240" />
        <g class="flyer flyer--a"><text>✈️</text></g>
        <g class="flyer flyer--small flyer--b"><text>🛩️</text></g>
      </svg>
      <span class="aurora__ridge"></span>
      <svg class="scene-road" viewBox="0 0 1440 300" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
        <path id="road" class="road-bed" d="M-60 262 C 300 150 560 258 820 165 S 1300 118 1520 205" />
        <path class="road-line" d="M-60 262 C 300 150 560 258 820 165 S 1300 118 1520 205" />
        <g class="roader roader--a"><text>🚗</text></g>
        <g class="roader roader--b"><text>🚙</text></g>
        <g class="roader roader--c"><text>🚌</text></g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
